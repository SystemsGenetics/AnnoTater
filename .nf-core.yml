repository_type: pipeline

nf_core_version: "3.5.1"

lint:
  main_nf_include_versions: false
  main_nf_include_used: false
  subworkflow_version: false
  module_version: false
  meta_include: false
  meta_name: false
  readme: false
  nf_test_content: false
  files_unchanged:
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-annotater_logo_light.png
    - docs/images/nf-core-annotater_logo_light.png
    - docs/images/nf-core-annotater_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierrc.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-annotater_logo_light.png
    - docs/images/nf-core-annotater_logo_light.png
    - docs/images/nf-core-annotater_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - nf-test.config
    - tests/default.nf.test

template:
  org: systemsgenetics
  name: Annotater
  description: Performs functional annotation of gene sequences
  author: Stephen Ficklin
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - rocrate
  is_nfcore: false
